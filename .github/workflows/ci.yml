name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

  env:
    NODE_ENV: test
    CLIENT_URL: http://localhost:3000
    MONGO_URI: mongodb://127.0.0.1:27017/av-erp-test

    JWT_SECRET: ci-jwt-secret-123456
    SUPER_ADMIN_JWT_SECRET: ci-super-admin-secret-123456
    PLATFORM_SECRET: ci-platform-secret-123456

    REDIS_DISABLED: 'true'
    PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Resolves every require and mounts every module route. app.js, not main.js:
      # main.js opens a DB connection and then listens forever.
      - name: Boot check
        run: npm run boot:check

      - name: Test
        run: npm test

      - name: Web build
        run: npm run build --workspace=apps/web
