services:
  # ── Backend Web Service (Render) ──
  - type: web
    name: av-erp-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false

  # ── Optional Frontend Static Site (Render Blueprint fallback) ──
  - type: web
    name: av-erp-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
